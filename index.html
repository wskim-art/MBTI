<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대학생 학습유형 검사 · MBTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg: #EEF2FA;
    --panel: #FFFFFF;
    --ink: #1E2A44;
    --ink-soft: #5B6787;
    --line: #DCE3F2;
    --highlight: #FFDD57;
    --highlight-soft: #FFF1B8;
    --pink: #FF6F91;
    --mint: #2EC4B6;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,221,87,0.20), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(46,196,182,0.14), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    color:var(--ink-soft);
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--highlight);box-shadow:0 0 0 3px var(--highlight-soft);}

  .card{
    background:var(--panel);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:0 20px 40px -28px rgba(30,42,68,0.35);
    padding:36px 32px;
  }
  @media(max-width:480px){ .card{padding:26px 20px;} }

  /* ---------- INTRO ---------- */
  .hero-title{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    letter-spacing:-0.02em;
    font-size:38px;
    line-height:1.3;
    margin:0 0 6px;
  }
  .hero-title .mark{
    position:relative;
    display:inline-block;
  }
  .hero-title .mark::after{
    content:'';
    position:absolute;
    left:-4px; right:-4px; bottom:2px;
    height:14px;
    background:var(--highlight);
    z-index:-1;
    border-radius:2px;
    transform:skewX(-6deg);
  }
  .hero-sub{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.7;
    margin:0 0 26px;
  }
  .meta-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .meta-pill{
    font-size:12.5px;
    font-family:'Space Grotesk', sans-serif;
    background:#F5F7FC;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:6px 12px;
    border-radius:999px;
  }
  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:16px;
    border-radius:12px;
    padding:15px 22px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:var(--ink);
    color:#fff;
    width:100%;
  }
  .btn-primary:hover{ box-shadow:0 10px 20px -10px rgba(30,42,68,0.6); }
  .btn-ghost{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line);
  }

  /* ---------- QUIZ ---------- */
  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
  }
  .progress-track{
    position:relative;
    height:10px;
    background:#F0F3FA;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:30px;
  }
  .progress-fill{
    position:absolute; left:0; top:0; bottom:0;
    background:linear-gradient(90deg, var(--highlight), #FFE98A);
    border-radius:999px;
    transition:width .35s ease;
  }
  .axis-tag{
    display:inline-block;
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    color:#8B6B00;
    background:var(--highlight-soft);
    padding:4px 10px;
    border-radius:8px;
    margin-bottom:14px;
  }
  .q-text{
    font-size:20px;
    font-weight:700;
    line-height:1.55;
    margin:0 0 28px;
  }
  .scale{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .scale-btn{
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    background:#FAFBFE;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  .scale-btn:hover{ border-color:#B9C4E0; background:#F3F6FC; }
  .scale-btn .bubble{
    width:20px;height:20px;border-radius:50%;
    border:2px solid var(--ink-soft);
    flex-shrink:0;
  }
  .scale-btn[data-val="1"] .bubble{ width:12px; height:12px; }
  .scale-btn[data-val="2"] .bubble{ width:15px; height:15px; }
  .scale-btn[data-val="3"] .bubble{ width:18px; height:18px; }
  .scale-btn[data-val="4"] .bubble{ width:21px; height:21px; }
  .scale-btn[data-val="5"] .bubble{ width:24px; height:24px; }

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:24px;
  }
  .link-btn{
    background:none;border:none;color:var(--ink-soft);
    font-size:14px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
    text-decoration:underline;
  }

  /* ---------- RESULT ---------- */
  #resultCapture{ background:var(--panel); border-radius:var(--radius); }
  .type-badge-wrap{
    text-align:center;
    padding:8px 0 22px;
  }
  .type-badge{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:56px;
    letter-spacing:0.05em;
    color:var(--ink);
    position:relative;
    display:inline-block;
  }
  .type-badge .hl-sweep{
    position:absolute;
    left:-6px; top:8%; bottom:8%;
    width:0;
    background:var(--highlight);
    z-index:-1;
    border-radius:3px;
    animation:sweep 0.9s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:.15s;
  }
  @keyframes sweep{ to{ width:calc(100% + 12px);} }
  .type-name{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    letter-spacing:-0.01em;
    font-size:23px;
    margin:6px 0 4px;
  }
  .type-desc{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:420px;
    margin:0 auto;
    line-height:1.6;
  }
  .axis-bars{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 20px;
    margin:24px 0 30px;
  }
  .axis-bar-item{ font-size:12px; color:var(--ink-soft); font-family:'Space Grotesk', sans-serif;}
  .axis-bar-labels{ display:flex; justify-content:space-between; margin-bottom:4px; }
  .axis-bar-track{ position:relative; height:6px; background:#EEF1F8; border-radius:99px; }
  .axis-bar-fill{ position:absolute; top:0; bottom:0; background:var(--mint); border-radius:99px; }

  .advice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:8px;
  }
  @media(max-width:480px){ .advice-grid{ grid-template-columns:1fr; } }
  .advice-card{
    background:#FAFBFE;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px 15px;
  }
  .advice-icon{
    width:30px;height:30px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    margin-bottom:10px;
  }
  .advice-card h4{
    margin:0 0 6px;
    font-size:13.5px;
    letter-spacing:0.01em;
  }
  .advice-card p{
    margin:0;
    font-size:13px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .ic-study{ background:#FFF1B8; }
  .ic-time{ background:#FFE0E8; }
  .ic-collab{ background:#DFF6F4; }
  .ic-focus{ background:#E4E9FB; }

  .share-row{
    display:flex;
    gap:10px;
    margin-top:22px;
  }
  .share-row .btn{ flex:1; font-size:14px; padding:13px; }
  .toast{
    position:fixed;
    bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:999px;
    font-size:13.5px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }
  .watermark{
    text-align:center;
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    color:#B7C0DA;
    margin-top:18px;
    letter-spacing:0.05em;
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand"><span class="dot"></span>CAMPUS STUDY TYPE LAB</div>
  <div class="card" id="cardRoot"></div>
</div>
<div class="toast" id="toast"></div>

/* ---------------- 상태 ---------------- */
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let resultType = null;

const root = document.getElementById('cardRoot');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

/* ---------------- 화면: 인트로 ---------------- */
function renderIntro(){
  root.innerHTML = `
    <h1 class="hero-title">나에게 맞는<br><span class="mark">공부법</span> 찾기</h1>
    <p class="hero-sub">32개 질문으로 알아보는 나만의 학습 스타일.<br>MBTI 기반으로 시험공부·과제·시간관리·팀플 방식까지 알려드려요.</p>
    <div class="meta-row">
      <span class="meta-pill">⏱ 약 4분 소요</span>
      <span class="meta-pill">📝 32문항</span>
      <span class="meta-pill">🎓 대학생 맞춤</span>
    </div>
    <button class="btn btn-primary" id="startBtn">검사 시작하기</button>
  `;
  document.getElementById('startBtn').onclick = ()=>{
    current = 0;
    answers = new Array(QUESTIONS.length).fill(null);
    renderQuiz();
  };
}

/* ---------------- 화면: 퀴즈 ---------------- */
const SCALE_LABELS = ['전혀 아니다','아니다','보통이다','그렇다','매우 그렇다'];

function renderQuiz(){
  const q = QUESTIONS[current];
  const pct = Math.round((current/QUESTIONS.length)*100);
  root.innerHTML = `
    <div class="quiz-top">
      <span>Q${current+1} / ${QUESTIONS.length}</span>
      <span>${pct}%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="axis-tag">${AXIS_LABEL[q.axis].title}</span>
    <p class="q-text">${q.text}</p>
    <div class="scale" id="scaleWrap">
      ${SCALE_LABELS.map((label,i)=>`
        <button class="scale-btn" data-val="${i+1}">
          <span class="bubble"></span>${label}
        </button>`).join('')}
    </div>
    <div class="nav-row">
      <button class="link-btn" id="backBtn" ${current===0?'style="visibility:hidden"':''}>이전 질문</button>
      <button class="link-btn" id="quitBtn">처음으로</button>
    </div>
  `;
  document.querySelectorAll('.scale-btn').forEach(btn=>{
    btn.onclick = ()=>{
      answers[current] = parseInt(btn.dataset.val,10);
      if(current < QUESTIONS.length-1){
        current++;
        renderQuiz();
      } else {
        calcResult();
      }
    };
  });
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = ()=>{ if(current>0){ current--; renderQuiz(); } };
  document.getElementById('quitBtn').onclick = renderIntro;
}

/* ---------------- 결과 계산 ---------------- */
function calcResult(){
  const score = {EI:0, SN:0, TF:0, JP:0};
  QUESTIONS.forEach((q,i)=>{
    const val = answers[i] ?? 3;
    const weight = (val - 3); // -2..2
    const firstLetter = q.axis[0]; // E, S, T, J
    const sign = (q.dir === firstLetter) ? 1 : -1;
    score[q.axis] += weight * sign;
  });
  const letters =
    (score.EI >= 0 ? 'E' : 'I') +
    (score.SN >= 0 ? 'S' : 'N') +
    (score.TF >= 0 ? 'T' : 'F') +
    (score.JP >= 0 ? 'J' : 'P');
  resultType = { code: letters, score };
  renderResult();
}

function axisPercent(axisScore){
  // score range roughly -16..16 -> map to 0-100 (right side strength)
  const clamped = Math.max(-16, Math.min(16, axisScore));
  return Math.round(((clamped+16)/32)*100);
}

/* ---------------- 화면: 결과 ---------------- */
function renderResult(){
  const t = TYPE_DATA[resultType.code];
  const s = resultType.score;
  root.innerHTML = `
    <div id="resultCapture">
      <div class="type-badge-wrap">
        <div class="type-badge"><span class="hl-sweep"></span>${resultType.code}</div>
        <div class="type-name">${t.name}</div>
        <p class="type-desc">${t.desc}</p>
      </div>

      <div class="axis-bars">
        ${['EI','SN','TF','JP'].map(ax=>{
          const lbl = AXIS_LABEL[ax];
          const pct = axisPercent(s[ax]);
          return `
          <div>
            <div class="axis-bar-labels">
              <span class="axis-bar-item">${lbl.left}</span>
              <span class="axis-bar-item">${lbl.right}</span>
            </div>
            <div class="axis-bar-track">
              <div class="axis-bar-fill" style="left:0; width:${pct}%; opacity:${pct>=50?0:1}"></div>
              <div class="axis-bar-fill" style="right:0; width:${100-pct}%; opacity:${pct>=50?1:0}; background:var(--pink);"></div>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div class="advice-grid">
        <div class="advice-card">
          <div class="advice-icon ic-study">📖</div>
          <h4>학습법</h4>
          <p>${t.study}</p>
        </div>
        <div class="advice-card">
          <div class="advice-icon ic-time">⏰</div>
          <h4>시간관리</h4>
          <p>${t.time}</p>
        </div>
        <div class="advice-card">
          <div class="advice-icon ic-collab">🤝</div>
          <h4>협업 스타일</h4>
          <p>${t.collab}</p>
        </div>
        <div class="advice-card">
          <div class="advice-icon ic-focus">🎯</div>
          <h4>집중 환경</h4>
          <p>${t.focus}</p>
        </div>
      </div>
      <div class="watermark">CAMPUS STUDY TYPE LAB · ${resultType.code}</div>
    </div>

    <div class="share-row">
      <button class="btn btn-ghost" id="copyBtn">텍스트 복사</button>
      <button class="btn btn-ghost" id="imgBtn">이미지 저장</button>
    </div>
    <button class="btn btn-primary" id="retryBtn" style="margin-top:10px;">다시 검사하기</button>
  `;

  document.getElementById('retryBtn').onclick = renderIntro;

  document.getElementById('copyBtn').onclick = async ()=>{
    const text = `[나의 학습유형: ${resultType.code} · ${t.name}]
${t.desc}

📖 학습법: ${t.study}
⏰ 시간관리: ${t.time}
🤝 협업 스타일: ${t.collab}
🎯 집중 환경: ${t.focus}`;
    try{
      await navigator.clipboard.writeText(text);
      showToast('결과가 클립보드에 복사됐어요');
    }catch(e){
      showToast('복사에 실패했어요');
    }
  };

  document.getElementById('imgBtn').onclick = ()=>{
    const target = document.getElementById('resultCapture');
    html2canvas(target, {backgroundColor:'#ffffff', scale:2}).then(canvas=>{
      const link = document.createElement('a');
      link.download = `study-type-${resultType.code}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('이미지가 저장됐어요');
    }).catch(()=>showToast('이미지 저장에 실패했어요'));
  };
}

renderIntro();
</script>
